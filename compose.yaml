name: async-agent-arena

services:
  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    init: true
    # In rootless Docker, container uid 0 maps to the unprivileged host user
    # and can write only the two explicitly mounted runtime directories.
    user: "0:0"
    env_file:
      - path: ./deploy/runtime.env
        required: false
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      ARENA_DATABASE_PATH: /data/arena-runtime.sqlite
      ARENA_OPERATOR_ADDRESS: ${ARENA_OPERATOR_ADDRESS:-0xC495ef51618D03267A1f227aFe5b27B38c748272}
      ARENA_RATE_LIMIT_MAX: ${ARENA_RATE_LIMIT_MAX:-60}
      ARENA_RATE_LIMIT_WINDOW_MS: ${ARENA_RATE_LIMIT_WINDOW_MS:-60000}
      ARENA_ONE_SHOT_TOURNAMENT: ""
      ARENA_DAILY_TOURNAMENT_STAKE_UNITS: ""
      ARENA_TOURNAMENTS_PAUSED: "1"
      ARENA_PAIR_ROOMS_ENABLED: ${ARENA_PAIR_ROOMS_ENABLED:-1}
      ARC_PAIR_ESCROW_ADDRESS: ${ARC_PAIR_ESCROW_ADDRESS:-0xD7CB8dE4cED8F988152CDc51EBCf7a17c602c6c1}
      ARC_TESTNET_RPC_URL: ${ARC_TESTNET_RPC_URL:-https://rpc.testnet.arc.io}
      ARC_AGENT_REGISTRY_V2_ADDRESS: ${ARC_AGENT_REGISTRY_V2_ADDRESS:-0xc427dBf5Dc0b58245Ac94d6634856Dd472bdEada}
      ARC_MARKETPLACE_ADDRESS: ${ARC_MARKETPLACE_ADDRESS:-0x48c15e258D9b87933B823c91Ace6EBC209Fba2Df}
      EVALUATION_FEE_USDC: ${EVALUATION_FEE_USDC:-1}
      ARC_EVO_FEE_ESCROW_ADDRESS: ${ARC_EVO_FEE_ESCROW_ADDRESS:-0xa7693481E17736F1617b3a6dc199aA31D86398E9}
      GENLAYER_EVALUATION_JUDGE_ADDRESS: ${GENLAYER_EVALUATION_JUDGE_ADDRESS:-0x0aA2B27D04BAa4438f2c3B9560eb7989de5a934d}
      ARC_TOURNAMENT_ESCROW_ADDRESS: ${ARC_TOURNAMENT_ESCROW_ADDRESS:-0xc908a4BFb6E94dDD3F32C34d9bfEBf774E3b702B}
      GENLAYER_COMPARISON_JUDGE_ADDRESS: ${GENLAYER_COMPARISON_JUDGE_ADDRESS:-0xe5210eCCC4182090A1416f515Dc7001B27274BcB}
    volumes:
      - ./data:/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks: [arena-internal]

  web:
    build:
      context: .
      target: web
      args:
        VITE_ARC_CHAIN_ID: ${VITE_ARC_CHAIN_ID:-5042002}
        VITE_ARC_NETWORK_NAME: ${VITE_ARC_NETWORK_NAME:-Arc Testnet}
        VITE_ARC_RPC_URL: ${VITE_ARC_RPC_URL:-https://rpc.testnet.arc.io}
        VITE_ARC_USDC_ADDRESS: ${VITE_ARC_USDC_ADDRESS:-0x3600000000000000000000000000000000000000}
        VITE_ARC_ESCROW_ADDRESS: ${VITE_ARC_ESCROW_ADDRESS:-0xc908a4BFb6E94dDD3F32C34d9bfEBf774E3b702B}
        VITE_ARENA_API_URL: /
        VITE_GENLAYER_CHAIN_ID: ${VITE_GENLAYER_CHAIN_ID:-61997}
        VITE_GENLAYER_NETWORK_NAME: ${VITE_GENLAYER_NETWORK_NAME:-GenLayer Studio Next}
        VITE_GENLAYER_RPC_URL: ${VITE_GENLAYER_RPC_URL:-https://studio-next.genlayer.com/api}
        VITE_GENLAYER_EXPLORER_URL: ${VITE_GENLAYER_EXPLORER_URL:-https://explorer-studio-dev.genlayer.com}
        VITE_GENLAYER_EVALUATION_JUDGE_ADDRESS: ${VITE_GENLAYER_EVALUATION_JUDGE_ADDRESS:-0x0aA2B27D04BAa4438f2c3B9560eb7989de5a934d}
        VITE_GENLAYER_COMPARISON_JUDGE_ADDRESS: ${VITE_GENLAYER_COMPARISON_JUDGE_ADDRESS:-0xe5210eCCC4182090A1416f515Dc7001B27274BcB}
    restart: unless-stopped
    init: true
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${ARENA_BIND_ADDRESS:-0.0.0.0}:${ARENA_HTTP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"
    networks: [arena-internal]

  tunnel:
    image: cloudflare/cloudflared@sha256:b269e8abd07a5bf6f3f4be65d5050b2174eca89c56a0241a8ff32a16aec454e4
    restart: unless-stopped
    # Root inside rootless Docker maps to the unprivileged host user and can
    # read the mode-0600 tunnel credential without widening host permissions.
    user: "0:0"
    command: tunnel --no-autoupdate --config /etc/cloudflared/config.yml run
    volumes:
      - ./deploy/cloudflared.yml:/etc/cloudflared/config.yml:ro
      - ./deploy/cloudflared-credentials.json:/etc/cloudflared/credentials.json:ro
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks: [arena-internal]

networks:
  arena-internal:
    internal: false
